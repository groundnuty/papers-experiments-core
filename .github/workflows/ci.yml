name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit check walks the pushed range, so history must be present.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the uv that made uv.lock, so CI does not look up "latest" on every run.
          version: "0.11.19"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make check
      - name: Study-token check over every commit this event adds
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-check-commits
