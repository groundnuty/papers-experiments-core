[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papers-experiments-core"
version = "0.1.0.dev0"
description = "Reusable core for agentic experiment studies: loop, records, campaigns, statistics and provenance tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
onedata = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expcore", "src/expcore_onedata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Template tooling under .claude/ is not this project's code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT", "C4", "RUF"]
