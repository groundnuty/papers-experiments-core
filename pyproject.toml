[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papers-experiments-core"
version = "0.1.0"
description = "Reusable core for agentic experiment studies: loop, records, campaigns, statistics and provenance tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
onedata = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
# The two packages and the example study, which a study that installs the core writes out with
# `python -m expcore example DEST`. Ignored files, such as the example's out/, are left out.
only-include = ["src/expcore", "src/expcore_onedata", "examples/tiny_study"]
# An editable install puts src/ on the path and reads the example and the hashes from the checkout.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"examples" = "expcore/examples"

# The public study-token hashes: the default list a replication package is checked against.
[tool.hatch.build.targets.wheel.force-include]
"tests/data/study_tokens.sha256" = "expcore/provenance/study_tokens.sha256"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
# Helper modules shared by several test files live here, outside any package, and are imported by plain name.
pythonpath = ["tests/support"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Template tooling under .claude/ is not this project's code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The source line of a sanitised import's provenance header (repository, 40-character commit, path, 40-character
# blob) has a fixed format and is longer than the line limit. Each imported module is listed here; the formatter
# still wraps its code at the limit.
"src/expcore/errors.py" = ["E501"]
"src/expcore/models/adapters.py" = ["E501"]
