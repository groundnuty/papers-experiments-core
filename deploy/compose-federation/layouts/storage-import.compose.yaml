        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "./start.sh"
        target: "/expcore/start.sh"
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 443
        host_ip: "127.0.0.1"
        published: "29644"
        protocol: "tcp"
    networks:
      fed:
        aliases: ["pine.expcore-fedimp.test"]
