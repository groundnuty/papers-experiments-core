      timeout: "5s"
      retries: 3
      start_period: "900s"
    env_file:
      - path: "${EXPCORE_FED_ROOT:?set by federation.py}/secrets/pine.env"
        required: false
    environment:
      ONEPANEL_BATCH_MODE: "true"
      ONEPANEL_LOG_LEVEL: "info"
      ONEPROVIDER_CONFIG: |
        cluster:
          domainName: "pine.expcore-fedimp.test"
          nodes:
            n1:
              hostname: "node1"
          managers:
            mainNode: "n1"
            nodes: ["n1"]
          workers:
            nodes: ["n1"]
          databases:
            serverQuota: 256
            bucketQuota: 256
            nodes: ["n1"]
          storages:
            posix:
              type: "posix"
              mountPoint: "/volumes/storage"
        oneprovider:
          geoLatitude: 0.0
          geoLongitude: 0.0
          register: true
          name: "pine"
          adminEmail: "admin@pine.expcore-fedimp.test"
          tokenProvisionMethod: "fromFile"
          tokenFile: "/expcore/registration-token"
          letsEncryptEnabled: false
          subdomainDelegation: false
          domain: "pine.expcore-fedimp.test"
        onezone:
          domainName: "zone.expcore-fedimp.test"
    volumes:
      - type: "bind"
        source: "${EXPCORE_FED_ROOT:?set by federation.py}/pine/persistence"
        target: "/volumes/persistence"
        bind:
          create_host_path: false
