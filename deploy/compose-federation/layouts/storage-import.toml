# The layout of the storage-import slot: one imported space and one uploaded space, both owned by the same provider and
# mirrored by the same two, so a study can compare the two ways a dataset reaches the federation.
#
#   EXPCORE_FED_IMPORT_ALPHA=<absolute path of the dataset directory> \
#     uv run python deploy/compose-federation/federation.py --layout deploy/compose-federation/layouts/storage-import.toml up
#
# `alpha-import` is held by its owner on an imported POSIX storage that is read-only: the platform finds the files by one
# scan of the directory the variable names and never writes there. `alpha-upload` is an ordinary space, empty after up,
# for a study to upload the same dataset into. A space with an import declares no baseline, and `reset --clean` is
# refused for this layout: run down, then up (README.md, "An imported space"). Every command of this layout, down
# included, needs the variable set, since the generated Compose file binds the directory it names.
#
# Every name is invented. Its project, domain and ports differ from the other layouts', so none shares a container, a
# network or a port with them. A root holds one federation at a time: run it after the others are down, or in a root of
# its own beside them. storage-import.compose.yaml beside it is what it generates.

project = "expcore-fedimp"
domain = "expcore-fedimp.test"
study_space = "alpha-upload"
memory_limit = "6g"              # four services: their limits together must fit in the host's available memory
platform_template = "storage-import.platform.toml.template"

[zone]
port = 29643

[providers.pine]
port = 29644

[providers.birch]
port = 29645

[providers.cedar]
port = 29646

[spaces.alpha-import]            # the dataset on pine's imported storage; its mirrors keep a regular storage
owner = "pine"
mirrors = ["birch", "cedar"]
baseline = false
import = { readonly = true, source_env = "EXPCORE_FED_IMPORT_ALPHA" }

[spaces.alpha-upload]            # the study space: the same dataset uploaded through the REST interface
owner = "pine"
mirrors = ["birch", "cedar"]
baseline = false

[principals.alpha-reader]
privileges = ["space_view", "space_read_data"]
spaces = ["alpha-import", "alpha-upload"]

[principals.alpha-tools]
privileges = ["space_view", "space_read_data"]
spaces = ["alpha-import", "alpha-upload"]

[principals.alpha-health]
privileges = ["space_view", "space_read_data"]
spaces = ["alpha-import", "alpha-upload"]
